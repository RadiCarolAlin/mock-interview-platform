apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: mock-interview-api-backend-config
  namespace: mock-interview
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /api/health
    port: 8080