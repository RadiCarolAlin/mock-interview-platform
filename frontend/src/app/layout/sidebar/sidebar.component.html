    </div>

    <div>
      <div class="logo-title">
        Mock Interview
      </div>

      <div class="logo-subtitle">

    </div>

  <nav class="navigation">

    @if (authService.isInterviewer()) {

      <a

        routerLinkActive="active">

      <a

    } @else {

      </a>

      <a

      </a>
